  TMT Bar 12mm:        {base: 63, floor: 61, stock: 5000}
  TMT Bar 8mm:         {base: 65, floor: 63, stock: 3000}
  Binding Wire:        {base: 82, floor: 78, stock: 200}
  Nails:               {base: 92, floor: 88, stock: 300}
  PVC Pipe 1 inch:     {base: 245, floor: 236, stock: 400}
  Electric Wire 1.5mm: {base: 1530, floor: 1480, stock: 60}
